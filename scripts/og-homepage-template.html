<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>OG Homepage</title>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		:root {
			--bg: #FAF9F6;
			--text: #1B1A17;
			--text-secondary: #67635B;
			--accent: #1E3A5F;
			--accent-light: #E7EBF1;
			--border: #E4E1DA;
		}

		body {
			width: 1200px;
			height: 630px;
			margin: 0;
			padding: 0;
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
			background: var(--bg);
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.og-homepage {
			width: 100%;
			height: 100%;
			position: relative;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 80px;
			background: var(--bg);
		}

		.og-homepage::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			height: 4px;
			background: var(--accent);
		}

		.og-logo-text {
			font-family: 'Cormorant Garamond', Georgia, serif;
			font-size: 64px;
			font-weight: 700;
			color: var(--accent);
			letter-spacing: 0.12em;
			text-transform: uppercase;
			margin-bottom: 24px;
		}

		.og-tagline {
			font-family: 'Inter', sans-serif;
			font-size: 22px;
			font-weight: 400;
			color: var(--text-secondary);
			line-height: 1.5;
			text-align: center;
			max-width: 700px;
			margin-bottom: 48px;
		}

		.og-features {
			display: flex;
			gap: 28px;
			flex-wrap: wrap;
			justify-content: center;
		}

		.og-feature-item {
			display: flex;
			align-items: center;
			gap: 10px;
			font-family: 'JetBrains Mono', monospace;
			font-size: 14px;
			font-weight: 500;
			color: var(--accent);
			padding: 10px 18px;
			border: 1px solid var(--border);
			background: var(--bg);
			border-radius: 2px;
		}

		.og-feature-icon {
			width: 8px;
			height: 8px;
			background: var(--accent);
			border-radius: 1px;
		}

		.og-bottom {
			position: absolute;
			bottom: 48px;
			left: 80px;
			right: 80px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding-top: 16px;
			border-top: 1px solid var(--border);
		}

		.og-url {
			font-family: 'JetBrains Mono', monospace;
			font-size: 13px;
			color: var(--text-tertiary);
			letter-spacing: 0.02em;
		}

		.og-brand-small {
			font-family: 'Cormorant Garamond', Georgia, serif;
			font-size: 16px;
			font-weight: 600;
			color: var(--accent);
			letter-spacing: 0.1em;
			text-transform: uppercase;
		}
	</style>
</head>
<body>
	<div class="og-homepage">
		<h1 class="og-logo-text">FÉLAG</h1>
		<p class="og-tagline">{{SUBTITLE}}</p>
		
		<div class="og-features">
			<div class="og-feature-item">
				<span class="og-feature-icon"></span>
				<span>{{FEATURE1}}</span>
			</div>
			<div class="og-feature-item">
				<span class="og-feature-icon"></span>
				<span>{{FEATURE2}}</span>
			</div>
			<div class="og-feature-item">
				<span class="og-feature-icon"></span>
				<span>{{FEATURE3}}</span>
			</div>
		</div>

		<div class="og-bottom">
			<span class="og-url">felag.online</span>
			<span class="og-brand-small">FÉLAG</span>
		</div>
	</div>
</body>
</html>
