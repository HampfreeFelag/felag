<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>OG Banner</title>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		:root {
			--bg: #FAF9F6;
			--text: #1B1A17;
			--text-secondary: #67635B;
			--text-tertiary: #7A756B;
			--accent: #1E3A5F;
			--border: #E4E1DA;
			--rubric-color: {{RUBRIC_COLOR}};
		}

		body {
			width: 1200px;
			height: 630px;
			margin: 0;
			padding: 0;
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
			background: var(--bg);
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.og-banner {
			width: 100%;
			height: 100%;
			position: relative;
			display: flex;
			flex-direction: column;
			padding: 64px 72px;
			background: var(--bg);
			border-left: 6px solid var(--rubric-color);
		}

		/* Top bar */
		.og-top {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 40px;
			padding-bottom: 18px;
			border-bottom: 1px solid var(--border);
		}

		.og-brand {
			font-family: 'Cormorant Garamond', Georgia, serif;
			font-size: 26px;
			font-weight: 700;
			color: var(--accent);
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		.og-rubric {
			font-family: 'JetBrains Mono', monospace;
			font-size: 12px;
			font-weight: 500;
			color: var(--rubric-color);
			letter-spacing: 0.06em;
			text-transform: uppercase;
			padding: 5px 12px;
			border: 1px solid var(--rubric-color);
			border-radius: 2px;
		}

		/* Content */
		.og-content {
			flex: 1;
			display: flex;
			flex-direction: column;
			justify-content: center;
		}

		.og-title {
			font-family: 'Cormorant Garamond', Georgia, serif;
			font-size: 48px;
			font-weight: 700;
			color: var(--text);
			line-height: 1.25;
			margin-bottom: 18px;
			max-width: 960px;
			letter-spacing: -0.01em;
		}

		.og-subtitle {
			font-family: 'Inter', sans-serif;
			font-size: 20px;
			font-weight: 400;
			color: var(--text-secondary);
			line-height: 1.5;
			max-width: 900px;
		}

		/* Bottom bar */
		.og-bottom {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-top: auto;
			padding-top: 20px;
			border-top: 1px solid var(--border);
		}

		.og-url {
			font-family: 'JetBrains Mono', monospace;
			font-size: 13px;
			color: var(--text-tertiary);
			letter-spacing: 0.02em;
		}

		.og-logo {
			font-family: 'Cormorant Garamond', Georgia, serif;
			font-size: 16px;
			font-weight: 600;
			color: var(--accent);
			letter-spacing: 0.1em;
			text-transform: uppercase;
		}
	</style>
</head>
<body>
	<div class="og-banner">
		<div class="og-top">
			<span class="og-brand">FÉLAG</span>
			<span class="og-rubric">{{RUBRIC}}</span>
		</div>
		<div class="og-content">
			<h1 class="og-title">{{TITLE}}</h1>
			<p class="og-subtitle">{{SUBTITLE}}</p>
		</div>
		<div class="og-bottom">
			<span class="og-url">felag.online</span>
			<span class="og-logo">FÉLAG</span>
		</div>
	</div>
</body>
</html>
